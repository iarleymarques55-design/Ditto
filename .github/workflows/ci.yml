# A cada push e pull request: lint, segurança e testes do backend, lint e build do painel,
# e as imagens Docker precisam montar. Nada é publicado daqui.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          # Banco descartável, que só existe durante este job e não é alcançável de fora
          POSTGRES_PASSWORD: ci-banco-descartavel
          POSTGRES_DB: ditto_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:ci-banco-descartavel@localhost:5432/ditto_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Dependências
        run: pip install -r requirements-dev.txt
      - name: Chromium para os testes
        run: python -m playwright install --with-deps chromium
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Segurança do código
        run: bandit -r app -ll -q
      - name: Dependências com falha conhecida
        run: pip-audit -r requirements.txt
      - name: Testes
        run: pytest -q -p no:warnings

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund --loglevel=error
      - name: Lint
        run: npx oxlint
      - name: Build
        run: npm run build
      - name: Dependências com falha conhecida
        run: npm audit --omit=dev

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Imagem da API e do worker
        run: docker build -t ditto-backend ./backend
      - name: Imagem do painel
        run: docker build -t ditto-web ./frontend
