<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Ditto: gravador</title>
  <style>
    body { width: 280px; margin: 0; padding: 14px; font: 14px/1.45 system-ui, -apple-system, 'Segoe UI', sans-serif; color: #13104f; background: #fdfdfb; }
    h1 { font-size: 16px; margin: 0 0 6px; }
    p { margin: 0 0 8px; color: #47567f; }
    .erro { color: #ad2a1e; font-weight: 500; }
    .acoes { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    button { font: inherit; font-weight: 500; min-height: 36px; padding: 0 12px; border-radius: 999px; cursor: pointer; border: 1px solid #4b37a0; background: transparent; color: #4b37a0; }
    button.cheio { background: #4b37a0; color: #fff; }
    button.leve { border-color: transparent; text-decoration: underline; color: #47567f; padding: 0 6px; }
    button:disabled { opacity: .55; cursor: not-allowed; }
    button:focus-visible { outline: 2px solid #4b37a0; outline-offset: 2px; }
  </style>
</head>
<body>
  <main id="conteudo" aria-live="polite"></main>
  <script src="popup.js"></script>
</body>
</html>
