# Cabeçalhos de segurança do painel. Ficam num arquivo só porque o nginx descarta os
# "add_header" do servidor dentro de um "location" que tenha os dele: cada bloco inclui este.
#
# __ORIGEM_DA_API__ é trocado no build da imagem pela origem de VITE_API_URL (veja o Dockerfile).
#
# Content-Security-Policy: o navegador só roda scripts do próprio painel e do login do Google.
# Mesmo que alguém consiga injetar HTML numa página, o script não carrega, e o token de acesso
# guardado no navegador não sai para outro servidor (connect-src fechado).
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' https://fonts.googleapis.com https://accounts.google.com/gsi/style; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://*.googleusercontent.com; connect-src 'self' __ORIGEM_DA_API__ https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# O painel não usa câmera, microfone, localização nem pagamento
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
# HSTS só vale com HTTPS. Quando o painel estiver publicado com certificado (Railway já entrega
# HTTPS), tire o "#" da linha abaixo: o navegador passa a recusar abrir o painel sem criptografia.
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
