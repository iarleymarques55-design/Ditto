server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    include /etc/nginx/snippets/seguranca.conf;

    # Arquivos com hash no nome nunca mudam: o navegador pode guardar por um ano
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/seguranca.conf;
    }

    # A extensão para baixar (página "Extensão"). Sem o arquivo, responde 404 em vez de abrir o
    # painel, e a página mostra que o download não está disponível. Sem cache: uma versão nova
    # da extensão chega no próximo clique
    location /downloads/ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
        add_header Content-Disposition "attachment";
        include /etc/nginx/snippets/seguranca.conf;
    }

    # O React Router cuida das rotas: qualquer endereço do painel abre o index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/seguranca.conf;
    }
}
